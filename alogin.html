<!DOCTYPE HTML>
<html lang='pt-br'>
	<head>
		<meta charset='utf-8'>
		<link rel='stylesheet' href='css/captive.css'>
		<title>Internet Compartilhada</title>
	</head>
	
	<body class='text'>
		<div id='background'></div>
		<div class='container'>		
			<div class='top'>
				<div class='logo-box'>
					<img class='logo-img' src='img/logo.png' alt='Internet Comunitária'>
				</div>
				<div class='text-green text-center'>
					Você está conectado.<br>
					Se não for redirecionado ao portal automaticamente, clique em "Abrir portal" abaixo.
				</div>
			</div>
			
			<div class='center bottom'>
				<button class='crystal-button green-crystal-button' onclick='connectClick();'>Abrir portal</button>
			</div>
		</div>
	</body>
	
	
	<script src='scripts/main.js'></script>
	<script>
		let connectURL = null;
		let defaultURL = 'https://www.google.com.br/';
		
		function connectClick() {
			if (connectURL) {
				window.location.href = connectURL;
			} else {
				alert('O portal de conexão ainda não foi carregado, aguarde alguns instantes e tente novamente.');
			}
		}
		
		tryLoadBackground();
		
		fetch('link.txt')
			.then(response => {
				if (!response.ok) {
					return defaultURL;
				}
				return response.text();
			})
			.then(text => {
				connectURL = text.trim();
			})
			.catch(error => {
				connectURL = defaultURL;
			});
		
		setTimeout(connectClick, 3000);
	</script>
</html>
