<!DOCTYPE HTML>
<html lang='pt-br'>
	<head>
		<meta charset='utf-8'>
		<link rel='stylesheet' href='css/captive.css'>
		<title>Internet Compartilhada</title>
	</head>
	
	<body class='text'>
		<div id='background'></div>
		<div class='container'>		
			<div class='top'>
				<div class='logo-box'>
					<img class='logo-img' id='logo' src='' alt='Internet Comunitária'>
				</div>
				<div class='text-center'>
					Bem vindo a Internet da <span class='text-bold nowrap'>Praça do Bairro</span>
				</div>
			</div>
			
			<div class='bottom'>
				$(if trial == 'yes')
				<div class='center'>
					<button class='crystal-button green-crystal-button' onclick='connectClick();'>Conectar</button>
				</div>
				$(else)
				<div class='center'>
					Internet desativada.
				</div>
				$(endif)
			</div>
		</div>
	</body>
	
	
	<script src='captive.js'></script>
	<script>
		function connectClick() {
			window.location.href = `$(link-login-only)?dst=&username=T-$(mac-esc)`;
		}
		
		loadImages();
	</script>
</html>
